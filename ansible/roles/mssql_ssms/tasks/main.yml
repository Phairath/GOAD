- name: check SQL Server Manager Studio installer exists
  win_stat:
    path: c:\setup\mssql\SSMS_installer.exe
  register: ssms_installer_file

- name: get the installer
  win_get_url:
      url: 'https://aka.ms/ssmsfullsetup'
      dest: 'c:\setup\mssql\SSMS_installer.exe'
  when: not ssms_installer_file.stat.exists

- name: check SSMS installation already done
  ansible.windows.win_powershell:
    script: |
      $installed = $false
      foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
        if (-not $root) {
          continue
        }

        $ssms = Get-ChildItem -Path $root -Directory -Filter 'Microsoft SQL Server Management Studio*' -ErrorAction SilentlyContinue |
          ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -Filter 'Ssms.exe' -ErrorAction SilentlyContinue
          } |
          Select-Object -First 1

        if ($ssms) {
          $installed = $true
          break
        }
      }

      $installed
  register: ssms_installation
  changed_when: false

- name: Install SSMS
  ansible.windows.win_command: c:\setup\mssql\SSMS_installer.exe --quiet --norestart --wait
  become: true
  become_method: runas
  become_user: SYSTEM
  register: install_ssms
  failed_when: install_ssms.rc not in [0, 3010]
  when: not (ssms_installation.output[0] | default(false) | bool)

- name: Reboot after install
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: install_ssms is changed
